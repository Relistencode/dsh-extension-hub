# dsh-myrules bundle patch — applied automatically when the package is
# installed with `dsh plugin --profile <name> add dsh-myrules`.
#
# The user's own profile cordis.patch.yml is applied AFTER bundle layers and
# wins per row, so every row here can still be overridden there.

- insert:
    - id: myrules
      name: dsh-myrules
